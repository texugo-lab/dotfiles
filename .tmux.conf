unbind C-b
set -g prefix C-space
bind C-space send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h resize-pane -L
bind C-j resize-pane -D
bind C-k resize-pane -U
bind C-l resize-pane -R

bind x kill-pane

bind r source-file $HOME/.tmux.conf

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

run '$HOME/.tmux/plugins/tpm/tpm'

set -g status-position top
set -g status-justify "absolute-centre"
set -g status-style "bg=#{@thm_bg}"
set -g status-left ""
set -ga status-left "#[fg=#{@thm_bg},bold]#{?client_prefix,#[bg=#{@thm_red}],#{?#{==:#{pane_mode},copy-mode},#[bg=#{@thm_yellow}],#[fg=#{@thm_fg}]}}#S"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_1}] | "

set -g status-right ""
set -ga status-right "#[bold]#[fg=#{@thm_yellow}] %H:%M #[fg=#{@thm_overlay_1}]| "
set -ga status-right "#[fg=#{@thm_yellow}]%d-%m"

set -g message-style 'bg=#{@thm_surface_2} fg=#{@thm_mauve} bold'

set -g window-status-separator "#[fg=#{@thm_overlay_1}]|"
set -g window-status-format '#[fg=#{@thm_mauve}] #I #W '
set -g window-status-current-format '#[bg=#{@thm_mauve},fg=#{@thm_bg},bold] #I #W '

set -g pane-border-style "fg=#{@thm_surface_2}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

