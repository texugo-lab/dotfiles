music_directory         "~/Music"
playlist_directory      "~/.config/mpd/playlists"
db_file                 "~/.config/mpd/mpd.db"
log_file                "~/.config/mpd/mpd.log"
pid_file                "~/.config/mpd/mpd.pid"
state_file              "~/.config/mpd/mpdstate"
auto_update             "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

input {
    plugin   "curl"
}

bind_to_address         "localhost"
port                    "6600"

audio_output {
        type            "pipewire"
        name            "PipeWire Output"
		server          "localhost"
}

audio_output {
        type                  "pipe"
        enabled            "yes"
        name                "ffmpeg pipe through udp (s302m[mpegts]@48000:16:2)"
        format              "44100:16:1"
        command        "ffmpeg -flags low_delay -re -ar 48000 -f s16le -ac 2 -i - -strict experimental -f mpegts -acodec s302m udp://localhost:6600 2>/tmp/mpd_ffmpeg_pipe.log"
}

audio_output {
        type            "pulse"
        name            "Pulse Output"
}

audio_output {
   type                 "fifo"
   name                 "my_fifo"
   path                 "/tmp/mpd.fifo"
   format               "44100:16:1"
}

audio_output {
    type                "httpd"
    name                "HTTP Stream"
    encoder             "lame"
    port                "6600"
    bind_to_address     "localhost"
    quality             "5.0"
    format              "44100:16:1"
}
