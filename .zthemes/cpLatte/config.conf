# See this wiki page for more info:
# https://github.com/dylanaraps/neofetch/wiki/Customizing-Info
print_info() {
    bat -p "$HOME/.config/neofetch/header.txt"
    prin "${blue}┌──────────────────────────────────────────────────〇"
    info "${blue}│ ${green} OS" distro
    info "${blue}│ ${green} Host" model
    info "${blue}│ ${green} Kernel" kernel
    info "${blue}│ ${green} Uptime" uptime
    info "${blue}│ ${green} Packages" packages
    info "${blue}│ ${green} Shell" shell
    info "${blue}│ ${green} DE" de
    info "${blue}│ ${green} WM" wm
    info "${blue}│ ${green} Memory" memory
    prin "${blue}└──────────────────────────────────────────────────〇"

    printf "\n                     ${reset}⬤ ${white}⬤ ${cyan}⬤ ${magenta}⬤ ${blue}⬤ ${yellow}⬤ ${green}⬤ ${red}⬤\n"
}

reset="\x1b[0m"
red="\x1b[38;2;210;15;57m"
green="\x1b[38;2;64;160;43m"
yellow="\x1b[38;2;223;142;29m"
blue="\x1b[38;2;30;102;245m"
magenta="\x1b[38;2;198;160;246m"
cyan="\x1b[38;2;4;165;229m"
white="\x1b[38;2;76;79;105m"

image_backend="off"