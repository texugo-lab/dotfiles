[mgr]
ratio = [ 0, 3, 2 ]
show_hidden = true

[preview]
tab_size = 4

[[plugin.prepend_previewers]]
url = "**/.git/"
run = 'preview-git'

[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TAL=2 --group-directories-first --no-quotes --icons=always --color=always "$1"'

[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run = 'piper -- echo "${1##*/}"; chafa -f symbols --align center --symbols vhalf --view-size ${w}x${h} "${1}"'

[[plugin.prepend_previewers]]
mime = "*executable*"
run = 'piper -- exiftool -f "$1"'

[[plugin.prepend_previewers]]
url = "*"
run = 'piper -- bat -p --color=always "$1"'
